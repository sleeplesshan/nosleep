name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Unit and process-adapter tests
        run: swift test
      - name: Build and package downloadable app
        run: bash scripts/package.sh
